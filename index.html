<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Botay VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Компонент для открытия презентации в новой вкладке
      AFRAME.registerComponent('open-presentation', {
        init: function () {
          this.el.addEventListener('click', function (evt) {
            window.open('presentation.html', '_blank');
          });
        }
      });

      // Универсальный компонент для геймпада и пульта
      AFRAME.registerComponent('vr-remote-controls', {
        schema: { speed: { default: 0.3 } },
        init: function () {
          this.keys = { forward: false, backward: false, left: false, right: false };
          this.gamepadIndex = null;

          // Отслеживаем подключение контроллера/пульта
          window.addEventListener('gamepadconnected', (e) => {
            this.gamepadIndex = e.gamepad.index;
          });
          window.addEventListener('gamepaddisconnected', (e) => {
            if (this.gamepadIndex === e.gamepad.index) this.gamepadIndex = null;
          });

          // Эмуляция клавиатуры / стрелок
          window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') this.keys.forward = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.backward = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
          });
          window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') this.keys.forward = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') this.keys.backward = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
          });
        },
        tick: function () {
          const el = this.el;
          const rotation = el.object3D.rotation;
          let moveX = 0;
          let moveZ = 0;

          // Опрос геймпада
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          let gp = null;
          if (this.gamepadIndex !== null && gamepads[this.gamepadIndex]) {
            gp = gamepads[this.gamepadIndex];
          } else {
            for (let i = 0; i < gamepads.length; i++) {
              if (gamepads[i]) {
                gp = gamepads[i];
                this.gamepadIndex = i;
                break;
              }
            }
          }

          if (gp && gp.axes && gp.axes.length >= 2) {
            if (Math.abs(gp.axes[0]) > 0.1) moveX = gp.axes[0];
            if (Math.abs(gp.axes[1]) > 0.1) moveZ = gp.axes[1];
          }

          // Клавиши
          if (this.keys.forward) moveZ = -1;
          if (this.keys.backward) moveZ = 1;
          if (this.keys.left) moveX = -1;
          if (this.keys.right) moveX = 1;

          // Движение игрока
          if (moveX !== 0 || moveZ !== 0) {
            const speed = this.data.speed;
            const cos = Math.cos(rotation.y);
            const sin = Math.sin(rotation.y);
            const pos = el.getAttribute('position');

            pos.x -= (moveX * cos - moveZ * sin) * speed;
            pos.z -= (moveX * sin + moveZ * cos) * speed;
            el.setAttribute('position', pos);
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- Загрузка оптимизированной легкой модели -->
      <a-assets>
        <a-asset-item id="botay" src="botay_final.glb"></a-asset-item>
      </a-assets>

      <!-- Базовое освещение -->
      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 2 1"></a-light>

      <!-- Модель раскопа -->
      <a-entity gltf-model="#botay" position="0 0 0"></a-entity>

      <!-- Интерактивная метка точно по координатам -->
      <a-entity position="-656.00 1.60 134.24">
        <a-sphere class="clickable" open-presentation radius="1.5" color="#f97316" opacity="0.9"
                  animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true">
        </a-sphere>
        <a-text value="Ботайская лошадь\n(Задержите взгляд)" position="0 2.5 0" align="center" width="15" color="#ffffff"></a-text>
      </a-entity>

      <!-- Камера с поддержкой геймпада и автокликом -->
      <a-entity id="player" position="0 1.6 3">
        <a-camera vr-remote-controls look-controls wasd-controls="acceleration: 400">
          <a-cursor raycaster="objects: .clickable" 
                    color="#f97316" 
                    fuse="true" 
                    fuse-timeout="1200"
                    animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1200">
          </a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
