<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Botay VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Открытие презентации
      AFRAME.registerComponent('open-presentation', {
        init: function () {
          this.el.addEventListener('click', function () {
            window.open('presentation.html', '_blank');
          });
        }
      });

      // Авто-ходьба по взгляду / кнопке пульта
      AFRAME.registerComponent('gaze-walker', {
        schema: { speed: { default: 0.2 } },
        init: function () {
          this.isWalking = false;
          
          // По клику на экран или кнопку пульта переключаем режим ходьбы (идти / стоять)
          window.addEventListener('click', () => {
            this.isWalking = !this.isWalking;
          });
          
          // Также поддерживаем пробел/Enter с клавиатуры или пульта
          window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
              this.isWalking = !this.isWalking;
            }
          });
        },
        tick: function () {
          if (!this.isWalking) return;

          const rig = this.el;
          const cameraEl = rig.querySelector('a-camera');
          const yaw = cameraEl ? cameraEl.object3D.rotation.y : 0;

          const speed = this.data.speed;
          const pos = rig.getAttribute('position');

          // Идем строго туда, куда смотрит камера
          pos.x -= Math.sin(yaw) * speed;
          pos.z -= Math.cos(yaw) * speed;
          rig.setAttribute('position', pos);
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="botay" src="botay_final.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 2 1"></a-light>

      <!-- Модель раскопа -->
      <a-entity gltf-model="#botay" position="0 0 0"></a-entity>

      <!-- Интерактивная метка -->
      <a-entity position="-656.00 1.60 134.24">
        <a-sphere class="clickable" open-presentation radius="1.5" color="#f97316" opacity="0.9"
                  animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true">
        </a-sphere>
        <a-text value="Ботайская лошадь\n(Задержите взгляд)" position="0 2.5 0" align="center" width="15" color="#ffffff"></a-text>
      </a-entity>

      <!-- Камера с компонентом ходьбы -->
      <a-entity id="player" position="0 1.6 3" gaze-walker>
        <a-camera look-controls wasd-controls="enabled: false">
          <a-cursor raycaster="objects: .clickable" 
                    color="#f97316" 
                    fuse="true" 
                    fuse-timeout="1200"
                    animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1200">
          </a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
