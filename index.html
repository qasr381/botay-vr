<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ботай VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      // Компонент, чтобы сделать скан полностью освещенным (unlit)
      AFRAME.registerComponent('unlit-model', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (obj) {
              obj.traverse((node) => {
                if (node.isMesh && node.material) {
                  node.material.wireframe = false;
                  // Включаем отображение текстуры без глубоких теней
                  if ('metalness' in node.material) node.material.metalness = 0;
                  if ('roughness' in node.material) node.material.roughness = 1;
                }
              });
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene embedded vr-mode-ui="enabled: true">
      <a-assets>
        <a-asset-item id="botay-model" src="botay_final.glb"></a-asset-item>
      </a-assets>

      <a-entity 
        gltf-model="#botay-model" 
        unlit-model
        position="0 0 -5" 
        scale="1 1 1">
      </a-entity>

      <a-light type="ambient" color="#ffffff" intensity="2"></a-light>
      <a-sky color="#87CEEB"></a-sky>
    </a-scene>
  </body>
</html>
