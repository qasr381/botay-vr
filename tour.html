<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Botay VR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="controls.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #coords-display {
        position: fixed; top: 15px; left: 15px;
        background: rgba(0, 0, 0, 0.85); color: #00ffcc;
        padding: 10px 15px; font-family: monospace; font-size: 16px;
        border-radius: 8px; border: 1px solid #00ffcc;
        z-index: 9999; pointer-events: none; white-space: pre;
      }
      #dbg {
        position: fixed; bottom: 15px; left: 15px; max-width: 60vw; max-height: 50vh; overflow: hidden;
        background: rgba(0, 0, 0, 0.85); color: #ffd166; padding: 8px 12px;
        font-family: monospace; font-size: 13px; border-radius: 8px;
        z-index: 9999; pointer-events: none; white-space: pre; display: none;
      }
    </style>
    <script>
      // ---------- геометрия: расстояние от точки до треугольника в плоскости XZ ----------
      function segD(px, pz, ax, az, bx, bz) {
        const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz;
        let t = l > 0 ? ((px - ax) * dx + (pz - az) * dz) / l : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const qx = ax + t * dx - px, qz = az + t * dz - pz;
        return Math.sqrt(qx * qx + qz * qz);
      }
      function triD(px, pz, ax, az, bx, bz, cx, cz) {
        const d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
        if (Math.abs(d) > 1e-9) {
          const l0 = ((bz - cz) * (px - cx) + (cx - bx) * (pz - cz)) / d;
          const l1 = ((cz - az) * (px - cx) + (ax - cx) * (pz - cz)) / d;
          if (l0 >= 0 && l1 >= 0 && 1 - l0 - l1 >= 0) return 0;
        }
        return Math.min(segD(px, pz, ax, az, bx, bz), segD(px, pz, bx, bz, cx, cz), segD(px, pz, cx, cz, ax, az));
      }

      const BUILD = '15';
      // Начальная точка и взгляд. yaw в градусах: 0 = смотрим на -Z, 90 = на -X, -90 = на +X, 180 = на +Z.
      // Пол под точкой находится сам. Клавиша K в игре показывает готовую строку для текущего места и взгляда.
      const SPAWN = { x: 110.2, z: 37.56, yaw: 90 };
      window.TP_ADJ = 0;   // живая поправка высоты сфер с пятым числом (клавиши U / J)

      // виден ли объект (все родители тоже): скрытые сферы не должны срабатывать от взгляда
      function shown(el) {
        let o = el.object3D;
        while (o) { if (!o.visible) return false; o = o.parent; }
        return true;
      }

      // переход на другую страницу в той же вкладке; перед уходом запоминаем место игрока
      function goTo(url) {
        const pl = document.getElementById('player'), pc = pl && pl.components['player-controls'];
        if (pc && pc.saveState) pc.saveState();
        location.href = url;
      }
      // возврат из кэша браузера (кнопка «Назад»): сохранённое место уже не нужно, страница и так на прежнем месте
      addEventListener('pageshow', (e) => { if (e.persisted) { try { sessionStorage.removeItem('botayReturn'); } catch (_) {} } });

      AFRAME.registerComponent('open-presentation', {
        init: function () {
          this.el.addEventListener('click', () => {
            if (!shown(this.el)) return;
            goTo('presentation.html');
          });
        }
      });

      // HUD
      AFRAME.registerComponent('coord-tracker', {
        init: function () { this.t = 0; },
        tick: function (time) {
          if (time - this.t < 100) return;
          this.t = time;
          const hud = document.getElementById('coords-display');
          const p = this.el.object3D.position;
          const w = document.getElementById('terrain').components['collision-world'];
          const pc = this.el.components['player-controls'];
          const dd = pc ? pc.data : {};
          if (hud) hud.innerText =
            `X: ${p.x.toFixed(2)} | Y: ${p.y.toFixed(2)} | Z: ${p.z.toFixed(2)}\n` +
            `коллизии: ${w ? w.status : 'нет'}\n` +
            `рост ${dd.rigHeight}  скорость ${dd.speed}  шаг ${dd.stepUp}\n` +
            `сборка ${BUILD} | сферы в комнатах: ${window.TP_ADJ > 0 ? '+' : ''}${window.TP_ADJ} (U выше, J ниже)\nSpace прыжок | C присесть | Shift бег\n[ ] рост | - = скорость | , . шаг | P диагностика | O меши | I скрыть | M меню | K спавн`;
        }
      });

      /* ===== collision-world: корзины 32 м -> лениво запекаемая сетка 0.5 м ===== */
      AFRAME.registerComponent('collision-world', {
        schema: {
          bucket: { default: 32 },
          cell: { default: 0.5 },
          minUpNormal: { default: 0.15 },
          maxChunks: { default: 40 },
          exclude: { default: '' },    // regex по именам мешей, которые НЕ учитывать, например 'Object_2'
          invisible: { default: '^col_' },   // меши с таким именем не рисуются, но дают коллизию (невидимые стены)
          hide: { default: '^Куб\\.?\\d*$' }   // regex по именам мешей, которые ещё и скрываются (кубы-метки; three убирает точки из имён: Куб.010 -> Куб010)
        },
        init: function () {
          this.ready = false;
          this.status = 'ждём модель…';
          this.parts = [];
          this.buckets = new Map();
          this.chunks = new Map();
          this.queue = [];
          this.curKey = null;
          this.report = '';
          this._t = new Float32Array(9);
          this.el.addEventListener('model-loaded', () => {
            this.status = 'подготовка (несколько секунд)…';
            setTimeout(() => this.build(), 60);
          });
        },
        bk: function (bx, bz) { return (bx + 8192) * 16384 + (bz + 8192); },
        tri: function (part, t, out) {
          const g = part.geo, p = g.attributes.position, idx = g.index, m = part.m.elements;
          for (let k = 0; k < 3; k++) {
            const vi = idx ? idx.getX(t * 3 + k) : t * 3 + k;
            const x = p.getX(vi), y = p.getY(vi), z = p.getZ(vi);
            out[k * 3]     = m[0] * x + m[4] * y + m[8]  * z + m[12];
            out[k * 3 + 1] = m[1] * x + m[5] * y + m[9]  * z + m[13];
            out[k * 3 + 2] = m[2] * x + m[6] * y + m[10] * z + m[14];
          }
        },
        build: function () {
          const root = this.el.getObject3D('mesh');
          if (!root) { this.status = 'модель не найдена'; return; }
          root.updateMatrixWorld(true);
          const ex = this.data.exclude ? new RegExp(this.data.exclude, 'i') : null;
          const parts = this.parts;

          const hideRe = this.data.hide ? new RegExp(this.data.hide, 'i') : null;
          const colRe = this.data.invisible ? new RegExp(this.data.invisible, 'i') : null;
          root.traverse((o) => {
            const nm0 = o.name || (o.parent && o.parent.name) || '';
            const isCol = !!(colRe && o.isMesh && colRe.test(nm0));
            if (hideRe && o.isMesh && hideRe.test(nm0)) o.visible = false;
            if (!o.isMesh || (!o.visible && !isCol) || !o.geometry || !o.geometry.attributes.position) return;
            const name = o.name || (o.parent && o.parent.name) || '?';
            if (ex && ex.test(name)) return;
            const g = o.geometry;
            const triCount = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
            if (o.isInstancedMesh) {
              if (o.count * triCount > 2e6) { console.warn('collision: instanced mesh пропущен', name); return; }
              const im = new THREE.Matrix4();
              for (let i = 0; i < o.count; i++) {
                o.getMatrixAt(i, im);
                parts.push({ geo: g, name: name, m: new THREE.Matrix4().multiplyMatrices(o.matrixWorld, im), n: triCount });
              }
            } else {
              parts.push({ geo: g, name: name, m: o.matrixWorld, n: triCount });
            }
            if (isCol) o.visible = false;   // col_-меш остаётся в коллизии, но на экране его нет
          });

          const B = this.data.bucket, t = this._t;
          let total = 0, skipped = 0;
          const stats = new Map();
          for (let pi = 0; pi < parts.length; pi++) {
            const part = parts[pi];
            let s = stats.get(part.name);
            if (!s) { s = { n: 0, x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9, z0: 1e9, z1: -1e9 }; stats.set(part.name, s); }
            for (let ti = 0; ti < part.n; ti++) {
              this.tri(part, ti, t);
              const minX = Math.min(t[0], t[3], t[6]), maxX = Math.max(t[0], t[3], t[6]);
              const minZ = Math.min(t[2], t[5], t[8]), maxZ = Math.max(t[2], t[5], t[8]);
              const minY = Math.min(t[1], t[4], t[7]), maxY = Math.max(t[1], t[4], t[7]);
              s.n++;
              if (minX < s.x0) s.x0 = minX; if (maxX > s.x1) s.x1 = maxX;
              if (minY < s.y0) s.y0 = minY; if (maxY > s.y1) s.y1 = maxY;
              if (minZ < s.z0) s.z0 = minZ; if (maxZ > s.z1) s.z1 = maxZ;
              const bx0 = Math.floor(minX / B), bx1 = Math.floor(maxX / B);
              const bz0 = Math.floor(minZ / B), bz1 = Math.floor(maxZ / B);
              if ((bx1 - bx0 + 1) * (bz1 - bz0 + 1) > 256) { skipped++; continue; }
              for (let bx = bx0; bx <= bx1; bx++) for (let bz = bz0; bz <= bz1; bz++) {
                const k = this.bk(bx, bz);
                let a = this.buckets.get(k);
                if (!a) { a = []; this.buckets.set(k, a); }
                a.push(pi, ti);
              }
              total++;
            }
          }
          const rows = [];
          stats.forEach((s, name) => rows.push([s.n, `${name}: ${s.n} тр  X ${s.x0 | 0}..${s.x1 | 0}  Y ${s.y0 | 0}..${s.y1 | 0}  Z ${s.z0 | 0}..${s.z1 | 0}`]));
          rows.sort((a, b) => b[0] - a[0]);
          this.report = 'МЕШИ:\n' + rows.slice(0, 16).map(r => r[1]).join('\n');
          console.log(this.report);
          console.log(`collision: треугольников ${total}, пропущено огромных ${skipped}, корзин ${this.buckets.size}`);
          this.ready = true;
          this.status = 'готово';
        },
        bakeChunk: function (cx, cz) {
          const B = this.data.bucket, C = this.data.cell, n = Math.round(B / C);
          const x0 = cx * B, z0 = cz * B, minUp = this.data.minUpNormal;
          const floors = new Map(), walls = new Map();
          const list = this.buckets.get(this.bk(cx, cz));
          const t = this._t;
          const push = (map, k, a, b) => {
            let arr = map.get(k);
            if (!arr) { arr = []; map.set(k, arr); }
            arr.push(a);
            if (b !== undefined) arr.push(b);
          };
          if (list) {
            for (let q = 0; q < list.length; q += 2) {
              this.tri(this.parts[list[q]], list[q + 1], t);
              const ax = t[0], ay = t[1], az = t[2], bx = t[3], by = t[4], bz = t[5], cx_ = t[6], cy = t[7], cz_ = t[8];
              const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx_ - ax, vy = cy - ay, vz = cz_ - az;
              const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
              const nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
              if (nl < 1e-12) continue;
              const i0 = Math.max(0, Math.floor((Math.min(ax, bx, cx_) - x0) / C));
              const i1 = Math.min(n - 1, Math.floor((Math.max(ax, bx, cx_) - x0) / C));
              const j0 = Math.max(0, Math.floor((Math.min(az, bz, cz_) - z0) / C));
              const j1 = Math.min(n - 1, Math.floor((Math.max(az, bz, cz_) - z0) / C));
              if (i0 > i1 || j0 > j1) continue;

              if (Math.abs(ny) / nl < minUp) {
                // СТЕНА: записываем вертикальный диапазон в клетки, которых касается треугольник
                const lo = Math.min(ay, by, cy), hi = Math.max(ay, by, cy);
                for (let j = Math.max(0, j0 - 1); j <= Math.min(n - 1, j1 + 1); j++) {
                  const pz = z0 + (j + 0.5) * C;
                  for (let i = Math.max(0, i0 - 1); i <= Math.min(n - 1, i1 + 1); i++) {
                    const px = x0 + (i + 0.5) * C;
                    if (triD(px, pz, ax, az, bx, bz, cx_, cz_) <= C * 0.7) push(walls, i + j * n, lo, hi);
                  }
                }
                continue;
              }
              // ПОЛ
              const d = (bz - cz_) * (ax - cx_) + (cx_ - bx) * (az - cz_);
              if (Math.abs(d) < 1e-12) continue;
              let hit = false;
              for (let j = j0; j <= j1; j++) {
                const pz = z0 + (j + 0.5) * C;
                for (let i = i0; i <= i1; i++) {
                  const px = x0 + (i + 0.5) * C;
                  const l0 = ((bz - cz_) * (px - cx_) + (cx_ - bx) * (pz - cz_)) / d;
                  const l1 = ((cz_ - az) * (px - cx_) + (ax - cx_) * (pz - cz_)) / d;
                  const l2 = 1 - l0 - l1;
                  if (l0 >= -0.001 && l1 >= -0.001 && l2 >= -0.001) {
                    push(floors, i + j * n, l0 * ay + l1 * by + l2 * cy); hit = true;
                  }
                }
              }
              if (!hit) {
                const gx = (ax + bx + cx_) / 3, gz = (az + bz + cz_) / 3;
                const i = Math.floor((gx - x0) / C), j = Math.floor((gz - z0) / C);
                if (i >= 0 && i < n && j >= 0 && j < n) push(floors, i + j * n, (ay + by + cy) / 3);
              }
            }
          }
          // слои пола: сортировка и склейка близких (<0.3)
          const L = new Map();
          floors.forEach((arr, k) => {
            arr.sort((a, b) => a - b);
            const m = [arr[0]];
            for (let i = 1; i < arr.length; i++) {
              if (arr[i] - m[m.length - 1] < 0.3) m[m.length - 1] = arr[i]; else m.push(arr[i]);
            }
            L.set(k, m);
          });
          // стены: склейка пересекающихся диапазонов
          const W = new Map();
          walls.forEach((arr, k) => {
            const iv = [];
            for (let i = 0; i < arr.length; i += 2) iv.push([arr[i], arr[i + 1]]);
            iv.sort((a, b) => a[0] - b[0]);
            const m = [iv[0][0], iv[0][1]];
            for (let i = 1; i < iv.length; i++) {
              if (iv[i][0] <= m[m.length - 1] + 0.1) m[m.length - 1] = Math.max(m[m.length - 1], iv[i][1]);
              else m.push(iv[i][0], iv[i][1]);
            }
            W.set(k, m);
          });
          const chunk = { n: n, L: L, W: W };
          this.chunks.set(cx + ',' + cz, chunk);
          return chunk;
        },
        getChunk: function (cx, cz) {
          return this.chunks.get(cx + ',' + cz) || this.bakeChunk(cx, cz);
        },
        locate: function (x, z) {
          const B = this.data.bucket, C = this.data.cell;
          const cx = Math.floor(x / B), cz = Math.floor(z / B);
          const ch = this.getChunk(cx, cz);
          const i = Math.min(ch.n - 1, Math.floor((x - cx * B) / C));
          const j = Math.min(ch.n - 1, Math.floor((z - cz * B) / C));
          return [ch, i + j * ch.n];
        },
        layersAt: function (x, z) { const r = this.locate(x, z); return r[0].L.get(r[1]); },
        surfaceAt: function (x, z, feetY, up) {
          const L = this.layersAt(x, z);
          if (!L) return null;
          for (let i = L.length - 1; i >= 0; i--) if (L[i] <= feetY + up) return L[i];
          return null;
        },
        // есть ли в клетке твёрдое (стена или поверхность) внутри вертикального диапазона тела lo..hi
        blockedAt: function (x, z, lo, hi) {
          const r = this.locate(x, z), L = r[0].L.get(r[1]), W = r[0].W.get(r[1]);
          if (L) for (let i = 0; i < L.length; i++) if (L[i] > lo && L[i] < hi) return true;
          if (W) for (let i = 0; i < W.length; i += 2) if (W[i + 1] > lo && W[i] < hi) return true;
          return false;
        },
        // как locate, но без запекания: null, если чанк ещё не запечён
        peek: function (x, z) {
          const B = this.data.bucket, C = this.data.cell;
          const cx = Math.floor(x / B), cz = Math.floor(z / B);
          const ch = this.chunks.get(cx + ',' + cz);
          if (!ch) return null;
          const i = Math.min(ch.n - 1, Math.floor((x - cx * B) / C));
          const j = Math.min(ch.n - 1, Math.floor((z - cz * B) / C));
          const k = i + j * ch.n;
          return [ch.L.get(k), ch.W.get(k)];
        },
        // прямая видимость от a до b: луч упирается в стену или в рельеф (слои пола не выше floorCap)
        // в незапечённых чанках препятствий нет (считаем, что видно)
        lineOfSight: function (a, b, floorCap) {
          const dx = b.x - a.x, dz = b.z - a.z, dy = b.y - a.y;
          const len = Math.hypot(dx, dz);
          const margin = 3;                              // у самих концов луча стены/пол не считаем
          const step = this.data.cell;
          for (let dist = margin; dist < len - margin; dist += step) {
            const t = dist / len;
            const y = a.y + dy * t;
            const c = this.peek(a.x + dx * t, a.z + dz * t);
            if (!c) continue;
            const L = c[0], W = c[1];
            if (W) for (let i = 0; i < W.length; i += 2) if (y > W[i] - 0.3 && y < W[i + 1] + 0.3) return false;
            if (L) {
              let g = null;
              for (let i = L.length - 1; i >= 0; i--) if (L[i] <= floorCap) { g = L[i]; break; }
              if (g !== null && y < g - 0.3) return false;
            }
          }
          return true;
        },
        // ближайший к yHint слой пола рядом с (x,z) (ищем по спирали до 10 единиц); null, если пола нет
        floorNear: function (x, z, yHint) {
          let best = null, bx = x, bz = z, bd = 1e9;
          for (let rad = 0; rad <= 10 && best === null; rad++) {
            for (let a = 0; a < (rad ? 8 : 1); a++) {
              const px = x + Math.cos(a * Math.PI / 4) * rad, pz = z + Math.sin(a * Math.PI / 4) * rad;
              const L = this.layersAt(px, pz);
              if (!L) continue;
              for (let i = 0; i < L.length; i++) {
                const dd = Math.abs(L[i] - yHint);
                if (dd < bd) { bd = dd; best = L[i]; bx = px; bz = pz; }
              }
              if (best !== null) break;
            }
          }
          return best === null ? null : { y: best, x: bx, z: bz };
        },
        update: function (x, z) {
          const B = this.data.bucket;
          const cx = Math.floor(x / B), cz = Math.floor(z / B), key = cx + ',' + cz;
          if (key !== this.curKey) {
            this.curKey = key;
            this.queue = [];
            for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++)
              if (!this.chunks.has((cx + a) + ',' + (cz + b))) this.queue.push([cx + a, cz + b]);
            if (this.chunks.size > this.data.maxChunks) {
              this.chunks.forEach((v, k) => {
                const p = k.split(',');
                if (Math.abs(p[0] - cx) > 3 || Math.abs(p[1] - cz) > 3) this.chunks.delete(k);
              });
            }
          }
          if (this.queue.length) { const q = this.queue.pop(); this.getChunk(q[0], q[1]); }
        },
        // диагностика: какие меши лежат под точкой (x,z) и на каких высотах
        debugAt: function (x, z) {
          const B = this.data.bucket, cx = Math.floor(x / B), cz = Math.floor(z / B);
          const list = this.buckets.get(this.bk(cx, cz));
          const t = this._t, rows = [];
          if (list) for (let q = 0; q < list.length; q += 2) {
            const part = this.parts[list[q]];
            this.tri(part, list[q + 1], t);
            const dist = triD(x, z, t[0], t[2], t[3], t[5], t[6], t[8]);
            if (dist > 0.6) continue;
            const ux = t[3] - t[0], uy = t[4] - t[1], uz = t[5] - t[2], vx = t[6] - t[0], vy = t[7] - t[1], vz = t[8] - t[2];
            const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
            const steep = Math.abs(ny) / Math.sqrt(nx * nx + ny * ny + nz * nz) < this.data.minUpNormal;
            const lo = Math.min(t[1], t[4], t[7]), hi = Math.max(t[1], t[4], t[7]);
            rows.push([hi, `${part.name} ${steep ? 'СТЕНА' : 'пол'} y=${lo.toFixed(2)}..${hi.toFixed(2)}`]);
          }
          rows.sort((a, b) => b[0] - a[0]);
          const seen = new Set(), out = [];
          rows.forEach(r => { if (!seen.has(r[1])) { seen.add(r[1]); out.push(r[1]); } });

      AFRAME.registerComponent('player-controls', {

            if (e.code === 'Minus') d.speed = Math.max(3, d.speed - 3);

            if (e.code === 'Comma') d.stepUp = Math.max(0.1, +(d.stepUp - 0.1).toFixed(2));

          // перечитать список целей курсора, чтобы он увидел новые сферы
          setTimeout(() => {
            const c = document.querySelector('a-cursor');
            if (c && c.components.raycaster) c.components.raycaster.refreshObjects();
          }, 800);
        },
        tick: function () {
          if (!this.pending.length) return;
          const t = document.getElementById('terrain');
          const w = t && t.components['collision-world'];
          if (!w || !w.ready) return;
          const it = this.pending.pop();
          const f = w.floorNear(it.p[0], it.p[2], it.p[5] !== undefined ? it.p[5] : it.p[1] - 1);
          if (f) {
            it.floorY = f.y;
            it.g.object3D.position.set(it.p[0], f.y + it.p[4] * (it.p[6] || 1) + window.TP_ADJ, it.p[2]);
            this.placed.push(it);
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="coords-display">X: 0.00 | Y: 0.00 | Z: 0.00</div>
    <div id="dbg"></div>

    <a-scene gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/">
      <a-assets>
        <a-asset-item id="botay" src="botay_final.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 2 1"></a-light>

      <!-- исключаем невидимые кубы-телепорты из коллизий -->
      <a-entity id="terrain" gltf-model="#botay" position="0 0 0" collision-world="exclude: ^Куб\.?\d*$"></a-entity>

      <!-- сеть телепортов -->
      <a-entity tp-network></a-entity>

      <a-entity position="-656.00 1.60 134.24" los-hide="maxDist: 600">
        <a-sphere class="clickable" open-presentation radius="1.5" color="#f97316" opacity="0.9"
                  animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 800; loop: true">
        </a-sphere>
        <a-text value="Ботайская лошадь\n(Задержите взгляд)" position="0 2.5 0" align="center" width="15" color="#ffffff"></a-text>
      </a-entity>

      <a-entity id="player" position="110.2 2 37.56" coord-tracker player-controls>
        <a-camera look-controls wasd-controls="enabled: false">
          <a-cursor raycaster="objects: .clickable; far: 150"
                    color="#f97316"
                    fuse="true"
                    fuse-timeout="1200"
                    animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1200">
          </a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
    <script src="controls.js"></script>
  </body>
</html>
